name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline smoke tests
        run: |
          python _smoke.py
          python _smoke_agent.py
          python _smoke_hybrid.py
          python _smoke_env.py
          python _smoke_settings.py
          python _smoke_security_controls.py
          python _smoke_provider_setup.py
          python _smoke_laya_mcp.py
          python _smoke_telegram.py
          python _smoke_skills.py